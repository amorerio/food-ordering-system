<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Ordering System</title>
  
  <!-- Bootstrap 5 CSS -->
  <link 
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
    rel="stylesheet"
  />
  <!-- Bootstrap Icons -->
  <link 
    rel="stylesheet" 
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />

  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .order-card {
      border: none;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .header-bg {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      border-top-left-radius: 14px;
      border-top-right-radius: 14px;
    }
    .form-control:focus, .form-select:focus {
      border-color: #ff4b2b;
      box-shadow: 0 0 0 0.25rem rgba(255, 75, 43, 0.2);
    }
    .btn-place-order {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      color: white;
      font-weight: 600;
      transition: all 0.2s ease-in-out;
    }
    .btn-place-order:hover {
      opacity: 0.92;
      color: white;
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="py-5">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">

        <!-- Card Container -->
        <div class="card order-card bg-white">
          <div class="header-bg p-4 text-center">
            <h3 class="fw-bold mb-1"><i class="bi bi-basket me-2"></i>FOOD ORDERING SYSTEM</h3>
            <p class="small text-white-50 mb-0">Place your quick food order below</p>
          </div>

          <div class="card-body p-4 p-md-5">
            <!-- Alert Placeholder for Order Message -->
            <div id="alertPlaceholder" aria-live="polite"></div>

            <form id="orderForm">
              
              <!-- Customer Name -->
              <div class="mb-3">
                <label for="customerName" class="form-label fw-semibold text-secondary">
                  Customer Name:
                </label>
                <input 
                  type="text" 
                  class="form-control form-control-lg" 
                  id="customerName" 
                  placeholder="Enter your name" 
                  required 
                />
              </div>

              <!-- Choose Food -->
              <div class="mb-3">
                <label for="foodSelect" class="form-label fw-semibold text-secondary">
                  Choose Food:
                </label>
                <select class="form-select form-select-lg" id="foodSelect" required>
                  <option value="" selected disabled>-- Select a food item --</option>
                  <option value="Cheeseburger Deluxe" data-price="8.99">Cheeseburger Deluxe ($8.99)</option>
                  <option value="Pepperoni Pizza Slice" data-price="4.50">Pepperoni Pizza Slice ($4.50)</option>
                  <option value="Crispy Fried Chicken" data-price="9.50">Crispy Fried Chicken ($9.50)</option>
                  <option value="Classic Caesar Salad" data-price="6.75">Classic Caesar Salad ($6.75)</option>
                  <option value="Creamy Carbonara Pasta" data-price="11.00">Creamy Carbonara Pasta ($11.00)</option>
                </select>
              </div>

              <!-- Price (Automatically Displayed) -->
              <div class="mb-3">
                <label for="foodPrice" class="form-label fw-semibold text-secondary">
                  Price:
                </label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text">$</span>
                  <input 
                    type="text" 
                    class="form-control bg-light" 
                    id="foodPrice" 
                    value="0.00" 
                    readonly 
                  />
                </div>
              </div>

              <!-- Quantity -->
              <div class="mb-3">
                <label for="quantity" class="form-label fw-semibold text-secondary">
                  Quantity:
                </label>
                <input 
                  type="number" 
                  class="form-control form-control-lg" 
                  id="quantity" 
                  min="1" 
                  value="1" 
                  required 
                />
              </div>

              <!-- Total (Automatically Calculated) -->
              <div class="mb-4">
                <label for="totalPrice" class="form-label fw-semibold text-secondary">
                  Total:
                </label>
                <div class="input-group input-group-lg">
                  <span class="input-group-text">$</span>
                  <input 
                    type="text" 
                    class="form-control fw-bold text-danger bg-light" 
                    id="totalPrice" 
                    value="0.00" 
                    readonly 
                  />
                </div>
              </div>

              <!-- Place Order Button -->
              <button 
                type="submit" 
                id="submitBtn" 
                class="btn btn-place-order w-100 py-3 rounded-3 shadow-sm fs-5"
              >
                Place Order
              </button>

            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // --- 1. SUPABASE CONFIGURATION ---
    const SUPABASE_URL = "https://mxqrkxoyjqbewwrhfooh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rVtrIaU13sfJSevomt8QAA_KSJ15CHH";

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    // --- 2. DOM ELEMENTS ---
    const customerNameInput = document.getElementById("customerName");
    const foodSelect = document.getElementById("foodSelect");
    const foodPriceInput = document.getElementById("foodPrice");
    const quantityInput = document.getElementById("quantity");
    const totalPriceInput = document.getElementById("totalPrice");
    const orderForm = document.getElementById("orderForm");
    const submitBtn = document.getElementById("submitBtn");
    const alertPlaceholder = document.getElementById("alertPlaceholder");

    // Track current price in a variable
    let currentPrice = 0.00;

    // Helper function to calculate total
    function computeTotal() {
      const quantity = Math.max(0, parseInt(quantityInput.value, 10) || 0);
      const total = currentPrice * quantity;
      totalPriceInput.value = total.toFixed(2);
    }

    function updatePriceAndTotal() {
      const selectedOption = foodSelect.options[foodSelect.selectedIndex];

      if (selectedOption && selectedOption.dataset.price) {
        currentPrice = parseFloat(selectedOption.dataset.price);
        foodPriceInput.value = currentPrice.toFixed(2);
      } else {
        currentPrice = 0.00;
        foodPriceInput.value = "0.00";
      }

      computeTotal();
    }

    foodSelect.addEventListener("change", updatePriceAndTotal);
    updatePriceAndTotal();

    // --- REQUIREMENT: When quantity is changed, total automatically computes ---
    quantityInput.addEventListener("input", computeTotal);
    quantityInput.addEventListener("change", computeTotal);

    // --- 3. SHOW NOTIFICATION MESSAGE ---
    function showAlert(message, type) {
      alertPlaceholder.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
          <i class="bi bi-check-circle-fill me-2"></i>${message}
          <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
      `;
    }

    // --- 4. SUBMIT ORDER TO SUPABASE ---
    orderForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const customerName = customerNameInput.value.trim();
      const foodItem = foodSelect.value;
      const price = currentPrice;
      const quantity = parseInt(quantityInput.value, 10);
      const totalPrice = price * quantity;

      if (!customerName || !foodItem || !Number.isFinite(price) || price <= 0 || !Number.isInteger(quantity) || quantity <= 0) {
        showAlert("Please fill in all fields correctly.", "warning");
        return;
      }

      // Set button loading state
      submitBtn.disabled = true;
      submitBtn.innerText = "Placing Order...";

      try {
        if (!supabaseClient) {
          throw new Error("Supabase is not available. Check your internet connection and try again.");
        }

        const { error } = await supabaseClient
          .from("orders")
          .insert([
            {
              customer_name: customerName,
              food_item: foodItem,
              price: price,
              quantity: quantity,
              total_price: totalPrice
            }
          ]);

        if (error) throw error;

        // Display required message: "Order successfully placed!"
        showAlert("Order successfully placed!", "success");

        // Reset the form fields and prices
        orderForm.reset();
        currentPrice = 0.00;
        foodPriceInput.value = "0.00";
        totalPriceInput.value = "0.00";

      } catch (err) {
        console.error("Error inserting order:", err.message);
        showAlert("Failed to place order. " + err.message, "danger");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = "Place Order";
      }
    });
  </script>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
